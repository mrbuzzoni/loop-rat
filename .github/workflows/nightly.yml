# One shift, on GitHub's clock instead of your laptop's.
#
# A runner is a fresh checkout every time, so the interesting part is not
# running the shift - it is remembering. `bin/state pull` takes the checkpoint,
# the ledger and the hash-chained trace off the state branch before the shift,
# and `bin/state push` leaves them for the next run. Without that, `run-due`
# thinks every loop is running for the first time, the daily spend cap resets
# every run, and the chain restarts nightly, which is the same as not having one.
#
# Receipts are uploaded as artifacts rather than committed: they are evidence,
# not memory, and they are large.
name: nightly shift

on:
  schedule:
    - cron: "45 4 * * 1-5"      # 04:45 UTC, weekdays
  workflow_dispatch:
    inputs:
      loop:
        description: which loop to run (blank runs whatever is due)
        default: ""
        type: string
      dry_run:
        description: run every phase with the model stubbed
        default: true
        type: boolean

# Enough to read the repository and to write the state branch. Nothing else.
permissions:
  contents: write

concurrency:
  group: loop-rat-nightly
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the agent cli
        if: ${{ inputs.dry_run != true }}
        run: npm install -g @anthropic-ai/claude-code

      - name: check the setup before trusting it
        run: bin/rat doctor

      - name: remember what the last run knew
        run: |
          git config user.name "loop rat"
          git config user.email "loop-rat@users.noreply.github.com"
          bin/rat state pull

      - name: run the shift
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then FLAGS="--dry-run"; fi
          if [ -n "${{ inputs.loop }}" ]; then
            bin/shift "${{ inputs.loop }}" $FLAGS
          else
            bin/rat run-due $FLAGS
          fi
        continue-on-error: true

      - name: read the receipts
        run: |
          bin/rat receipts 10
          bin/rat audit --days 7

      - name: leave the memory for the next run
        if: always()
        run: bin/rat state push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipts
          path: state/receipts/
          retention-days: 14

      - name: fail the run if the record does not add up
        run: bin/rat audit --days 7 --json > /dev/null
